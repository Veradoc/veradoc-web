services:
  # --- OLLAMA SERVICE ---
  ollama:
    image: ollama/ollama:latest
    container_name: ollama  
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s     
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - veradoc-net
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-all}
              capabilities: [gpu]

  # --- OLLAMA CONFIGURATION SIDECAR ---
  ollama-sidecar:
    image: curlimages/curl:latest
    container_name: ollama-sidecar
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Waiting for network..."
        sleep 5
        
        echo "Waiting for Ollama API..."
        until curl -s http://ollama:11434/api/tags > /dev/null; do 
          sleep 2
        done
        
        echo "Pulling Llama 3.2 3B..."
        curl -s -X POST http://ollama:11434/api/pull -d '{"name": "hf.co/unsloth/Llama-3.2-3B-Instruct-GGUF"}'
        
        echo "Warming up Llama 3.2 3B..."
        curl -s -X POST http://ollama:11434/api/generate -d '{"model": "hf.co/unsloth/Llama-3.2-3B-Instruct-GGUF", "prompt": "hello", "keep_alive": -1}'
        
        echo "Pulling nomic-embed-text...";
        curl -X POST http://ollama:11434/api/pull -d '{"name": "hf.co/Ralriki/multilingual-e5-large-instruct-GGUF"}';

        echo "Warming up Nomic Embed...";
        curl -s -X POST http://ollama:11434/api/embeddings -d '{"model": "hf.co/Ralriki/multilingual-e5-large-instruct-GGUF", "keep_alive": -1}';

        echo "Verifying load..."
        curl -s http://ollama:11434/api/ps

        echo "Models loaded"
    depends_on:   
      ollama:
        condition: service_healthy
    networks:
      - veradoc-net     

volumes:
  ollama-data:
    name: ollama-data

networks:
  veradoc-net: 
    name: veradoc-net